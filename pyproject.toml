[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmfca"
version = "0.1.0"
description = "Attribute Exploration over LLMs: an FCA-flavored state machine that drives LangGraph to elicit attribute implications from open-source language models."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Adam Lei-Yi Chen-Abolacio" },
    { name = "Joaquín Borrego-Díaz" },
]
keywords = ["FCA", "attribute-exploration", "llm", "langgraph", "kbs"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "concepts>=0.9",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "langgraph>=0.2",
    "pandas>=2.0",
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "adjustText>=0.8",
]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["llmfca*"]

[tool.setuptools.package-data]
"llmfca.prompting" = ["*.py"]
